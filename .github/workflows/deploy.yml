name: Manual Deploy to InfinityFree (Child Theme Only)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy Child Theme via Robust FTP (lftp)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PATH: "/htdocs/wp-content/themes/astra-child"
        run: |
          echo "Starting robust FTP deploy of child theme..."

          lftp -e "
            set ftp:ssl-allow no;
            set net:max-retries 5;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 60;

            mirror --reverse --verbose \
                   --delete \
                   --only-newer \
                   --exclude-glob .git* \
                   --exclude-glob .github* \
                   --exclude-glob node_modules \
                   ./ \
                   \$REMOTE_PATH;

            bye
          " -u $FTP_USER,$FTP_PASS $FTP_HOST
